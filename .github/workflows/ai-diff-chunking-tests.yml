name: APES AI Diff Chunking Regression

on:
  pull_request:
    branches:
      - main
      - fix/oversized-ai-review-diff-hunks
    paths:
      - "scripts/call-review-gateway.js"
      - "scripts/review-chunk-executor.js"
      - "tests/review-chunk-executor.test.js"
      - "tests/oversized-hunk-chunking.test.js"
      - ".github/workflows/ai-diff-chunking-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Safe diff chunking and fail-closed tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Execute APES node unit tests
        run: npm test
