name: APES Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.test_file }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - assurance-prerequisites
          - classify-risk
          - config
          - dependency-audit
          - enforce-gate
          - gemini-pool
          - gemini-credential-pool-resilience
          - hermes-orchestrator
          - monorepo-validation
          - path-safety
          - provider-clients
          - repository-identity
          - review-checkpoint
          - review-chunking
          - review-validation
          - scan-secrets
          - security-assurance-audit
          - security-assurance-enforcement
          - security-headers
          - trusted-config
          - workflow-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run APES test file
        run: node --test "tests/${{ matrix.test_file }}.test.js"
