name: APES Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Test checkpoint resume and identity
        run: node --test tests/review-checkpoint.test.js
      - name: Test token-aware logical chunking
        run: node --test tests/review-chunking.test.js
      - name: Test independent Gemini transient rotation
        run: node --test tests/gemini-credential-pool-resilience.test.js
