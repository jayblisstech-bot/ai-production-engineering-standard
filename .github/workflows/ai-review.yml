name: APES AI Review Gate (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Reviewed APES release commit used to fetch central scripts
        required: true
        type: string
      config_path:
        description: Project-local APES JSON configuration path
        required: false
        default: .apes.json
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GEMINI_API_KEYS_JSON:
        required: false

concurrency:
  group: apes-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ref-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject mutable or ambiguous APES pipeline refs
        shell: bash
        env:
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
        run: |
          set -euo pipefail
          if [[ "$PIPELINE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Approved immutable APES commit: $PIPELINE_REF"
          else
            echo "Refusing mutable/ambiguous APES pipeline_ref: $PIPELINE_REF" >&2
            echo "Use a reviewed 40-character commit SHA. Branches and semantic-version tags can be retargeted." >&2
            exit 1
          fi

  risk-classify:
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      model_tier: ${{ steps.classify.outputs.model_tier }}
      human_approval_required: ${{ steps.classify.outputs.human_approval_required }}
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce changed-file list and full diff
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=80 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
          test -s /tmp/changed_files.txt
      - name: Deterministically classify risk
        id: classify
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          CHANGED_FILES_FILE: /tmp/changed_files.txt
          DIFF_TEXT_PATH: /tmp/pr.diff
        run: node pipeline/scripts/classify-risk.js

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: risk-classify
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce full diff
        run: |
          cd project
          git diff --no-ext-diff --unified=80 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Block potential secrets before any external AI call
        env:
          DIFF_TEXT_PATH: /tmp/pr.diff
        run: node pipeline/scripts/scan-secrets.js
      - name: Dependency vulnerability audit (project policy)
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: |
          corepack enable || true
          node pipeline/scripts/audit-dependencies.js
      - name: Verify configured runtime security headers
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/verify-configured-security-headers.js
      - name: APES 13-layer production security assurance
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          APES_AUDIT_OUTPUT: /tmp/apes-security-assurance.md
        run: node pipeline/scripts/security-assurance-audit.js

  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: risk-classify
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Enable Corepack when available
        run: corepack enable || true
      - name: Run required repository-native validation
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/run-validation.js

  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
    needs: [risk-classify, deterministic-checks, security-scan]
    if: ${{ success() && needs.risk-classify.outputs.model_tier != 'skip' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      p0_count: ${{ steps.review.outputs.p0_count }}
      p1_count: ${{ steps.review.outputs.p1_count }}
      p2_count: ${{ steps.review.outputs.p2_count }}
      reviewed_chunks: ${{ steps.review.outputs.reviewed_chunks }}
      required_chunks: ${{ steps.review.outputs.required_chunks }}
      checkpoint_complete: ${{ steps.review.outputs.checkpoint_complete }}
    steps:
      - name: Establish bounded review wall-clock budget
        shell: bash
        run: |
          set -euo pipefail
          # 16 minutes from the first AI-review step; the job hard limit is 20.
          # The gateway reserves another 90 seconds of this budget for publication.
          echo "APES_REVIEW_DEADLINE_MS=$(( ($(date +%s) + 960) * 1000 ))" >> "$GITHUB_ENV"
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce full review diff and changed-file list
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=80 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Prepare durable APES checkpoint directory
        run: mkdir -p "$RUNNER_TEMP/apes-checkpoint"

      - name: Locate checkpoint for matching workflow, PR and head
        id: previous-checkpoint-run
        if: ${{ github.event.pull_request.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"
          }
          artifact_name="apes-review-checkpoint-${PR_NUMBER}-${HEAD_SHA}"
          has_artifact() {
            local artifact_response
            artifact_response="$(api "https://api.github.com/repos/$REPOSITORY/actions/runs/$1/artifacts?per_page=100")"
            jq -e '.artifacts | type == "array"' <<< "$artifact_response" >/dev/null ||
              { echo "Malformed GitHub artifact response" >&2; exit 1; }
            jq -e --arg name "$artifact_name" 'any(.artifacts[]; .name == $name and .expired == false)' <<< "$artifact_response" >/dev/null
          }
          current="$(api "https://api.github.com/repos/$REPOSITORY/actions/runs/$CURRENT_RUN_ID")"
          workflow_id="$(jq -er '.workflow_id | numbers' <<< "$current")"
          previous=''
          if [[ "$RUN_ATTEMPT" -gt 1 ]] && has_artifact "$CURRENT_RUN_ID"; then
            previous="$CURRENT_RUN_ID"
          else
            response="$(api "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow_id/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")"
            # Capture jq exit status: process substitution would silently hide failures.
            candidates="$(jq -er --arg current "$CURRENT_RUN_ID" --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" '
              if (.workflow_runs | type) != "array" then error("Invalid workflow runs response") else
                [.workflow_runs[]
                 | select((.id | tostring) != $current)
                 | select(.head_sha == $head)
                 | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                 | select(any(.pull_requests[]?; .number == $pr))
                 | .id] | if length == 0 then "" else join("\n") end
              end' <<< "$response")"
            while IFS= read -r candidate; do
              [[ -z "$candidate" ]] && continue
              if has_artifact "$candidate"; then previous="$candidate"; break; fi
            done <<< "$candidates"
          fi
          echo "run_id=$previous" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            echo "Checkpoint artifact selected from run $previous for PR $PR_NUMBER at $HEAD_SHA"
          else
            echo 'No matching non-expired checkpoint artifact; running from the beginning.'
          fi

      - name: Restore verified checkpoint artifact
        if: ${{ steps.previous-checkpoint-run.outputs.run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: apes-review-checkpoint-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/apes-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-checkpoint-run.outputs.run_id }}
      - name: Run bounded, fail-closed AI review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS_JSON: ${{ secrets.GEMINI_API_KEYS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          RISK_TIER: ${{ needs.risk-classify.outputs.risk }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_TEXT_PATH: /tmp/pr.diff
          CHANGED_FILES_FILE: /tmp/changed_files.txt
          APES_CHECKPOINT_PATH: ${{ runner.temp }}/apes-checkpoint/review.json
        run: node pipeline/scripts/call-review-gateway.js
      - name: Persist APES review checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apes-review-checkpoint-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/apes-checkpoint/review.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [ref-guard, risk-classify, deterministic-checks, security-scan, ai-review]
    if: always()
    steps:
      - name: Fail closed on invalid APES pipeline ref
        if: ${{ needs.ref-guard.result != 'success' }}
        run: |
          echo "APES pipeline ref validation failed; refusing to evaluate the gate with untrusted/mutable pipeline code." >&2
          exit 1
      - name: Checkout pinned APES pipeline
        if: ${{ needs.ref-guard.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.ref-guard.result == 'success' }}
        with:
          node-version: "20"
      - name: Enforce machine controls and severity thresholds (fail closed)
        if: ${{ needs.ref-guard.result == 'success' }}
        env:
          RISK_RESULT: ${{ needs.risk-classify.result }}
          VALIDATION_RESULT: ${{ needs.deterministic-checks.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          AI_RESULT: ${{ needs.ai-review.result }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          VERDICT: ${{ needs.ai-review.outputs.verdict }}
          P0_COUNT: ${{ needs.ai-review.outputs.p0_count }}
          P1_COUNT: ${{ needs.ai-review.outputs.p1_count }}
          REVIEWED_CHUNKS: ${{ needs.ai-review.outputs.reviewed_chunks }}
          REQUIRED_CHUNKS: ${{ needs.ai-review.outputs.required_chunks }}
          CHECKPOINT_COMPLETE: ${{ needs.ai-review.outputs.checkpoint_complete }}
          RESTRICTED_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
        run: node pipeline/scripts/enforce-gate.js
