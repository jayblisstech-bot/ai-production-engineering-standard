name: APES AI Review Gate (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Reviewed APES release commit used to fetch central scripts
        required: false
        default: 4f02a1ed79fb972998623a62c05a254e0e450687
        type: string
      config_path:
        description: Project-local APES JSON configuration path
        required: false
        default: .apes.json
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GEMINI_API_KEYS_JSON:
        required: false

concurrency:
  group: apes-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ref-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject mutable or ambiguous APES pipeline refs
        shell: bash
        env:
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
        run: |
          set -euo pipefail
          if [[ "$PIPELINE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$PIPELINE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Approved immutable-style APES ref: $PIPELINE_REF"
          else
            echo "Refusing mutable/ambiguous APES pipeline_ref: $PIPELINE_REF" >&2
            echo "Use a reviewed 40-character commit SHA for production callers; exact semantic-version release tags remain accepted for controlled upgrade workflows." >&2
            exit 1
          fi

  risk-classify:
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      model_tier: ${{ steps.classify.outputs.model_tier }}
      human_approval_required: ${{ steps.classify.outputs.human_approval_required }}
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce changed-file list and full diff
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=80 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
          test -s /tmp/changed_files.txt
      - name: Deterministically classify risk
        id: classify
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          CHANGED_FILES_FILE: /tmp/changed_files.txt
          DIFF_TEXT_PATH: /tmp/pr.diff
        run: node pipeline/scripts/classify-risk.js

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: risk-classify
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce full diff
        run: |
          cd project
          git diff --no-ext-diff --unified=80 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Block potential secrets before any external AI call
        env:
          DIFF_TEXT_PATH: /tmp/pr.diff
        run: node pipeline/scripts/scan-secrets.js
      - name: Dependency vulnerability audit (project policy)
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: |
          corepack enable || true
          node pipeline/scripts/audit-dependencies.js
      - name: Verify configured runtime security headers
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/verify-configured-security-headers.js
      - name: APES 13-layer production security assurance
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          APES_AUDIT_OUTPUT: /tmp/apes-security-assurance.md
        run: node pipeline/scripts/security-assurance-audit.js

  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: risk-classify
    steps:
      - name: Checkout project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout pinned APES pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Enable Corepack when available
        run: corepack enable || true
      - name: Run required repository-native validation
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/run-validation.js

  provider-preflight:
    name: Hermes trusted-policy and model-route preflight (no API calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [risk-classify, deterministic-checks, security-scan]
    if: ${{ success() && needs.risk-classify.outputs.model_tier != 'skip' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout exact project PR head and tracked base refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout immutable APES release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve immutable event-base APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Verify tracked base policy and eligible Hermes routes before any AI calls
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          # These are booleans only: do not inject actual API keys into preflight.
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_GEMINI_API_KEYS_JSON: ${{ secrets.GEMINI_API_KEYS_JSON != '' }}
        run: node pipeline/scripts/hermes-preflight.js

  ai-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [risk-classify, deterministic-checks, security-scan, provider-preflight]
    if: ${{ success() && needs.provider-preflight.result == 'success' && needs.risk-classify.outputs.model_tier != 'skip' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    outputs:
      indices: ${{ steps.plan.outputs.indices }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - name: Checkout exact project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout immutable APES release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce complete changed-line diff with bounded AI context
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=3 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Generate complete immutable chunk review manifest
        id: plan
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          RISK_TIER: ${{ needs.risk-classify.outputs.risk }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_SHA: ${{ inputs.pipeline_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_TEXT_PATH: /tmp/pr.diff
          CHANGED_FILES_FILE: /tmp/changed_files.txt
        run: node pipeline/scripts/ai-chunk-protocol.js prepare

  ai-review-chunk:
    name: APES AI review chunk ${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [risk-classify, ai-manifest]
    if: ${{ needs.ai-manifest.result == 'success' }}
    # No concurrent provider calls or increase to the approved per-job timebox.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        index: ${{ fromJSON(needs.ai-manifest.outputs.indices) }}
    steps:
      - name: Checkout exact project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout immutable APES release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce complete changed-line diff with bounded AI context
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=3 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Review one bound chunk, fail closed on incomplete result
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS_JSON: ${{ secrets.GEMINI_API_KEYS_JSON }}
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          RISK_TIER: ${{ needs.risk-classify.outputs.risk }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_SHA: ${{ inputs.pipeline_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_TEXT_PATH: /tmp/pr.diff
          CHANGED_FILES_FILE: /tmp/changed_files.txt
          EXPECTED_MANIFEST_DIGEST: ${{ needs.ai-manifest.outputs.digest }}
          CHUNK_INDEX: ${{ matrix.index }}
          RESULT_FILE: ${{ github.workspace }}/result.json
        run: node pipeline/scripts/ai-chunk-protocol.js review
      - name: Save minimal validated chunk result only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apes-ai-chunk-${{ matrix.index }}
          path: ${{ github.workspace }}/result.json
          if-no-files-found: error
          retention-days: 1

  ai-review:
    name: APES AI full-coverage aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    needs: [risk-classify, ai-manifest, ai-review-chunk]
    if: ${{ always() && needs.ai-manifest.result == 'success' && needs.ai-review-chunk.result == 'success' }}
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      p0_count: ${{ steps.review.outputs.p0_count }}
      p1_count: ${{ steps.review.outputs.p1_count }}
      p2_count: ${{ steps.review.outputs.p2_count }}
      reviewed_chunks: ${{ steps.review.outputs.reviewed_chunks }}
    steps:
      - name: Checkout exact project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
      - name: Checkout immutable APES release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Resolve trusted base-branch APES policy
        env:
          PROJECT_ROOT: ${{ github.workspace }}/project
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_CONFIG_PATH: ${{ inputs.config_path }}
          OUTPUT_PATH: /tmp/apes-trusted.json
        run: node pipeline/scripts/materialize-trusted-config.js
      - name: Produce complete changed-line diff with bounded AI context
        run: |
          cd project
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          git diff --no-ext-diff --unified=3 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
      - name: Download only this run's immutable chunk result artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: apes-ai-chunk-*
          path: /tmp/apes-results
          merge-multiple: false
      - name: Require exact total coverage before posting any review findings
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_ROOT: ${{ github.workspace }}/project
          APES_CONFIG_PATH: /tmp/apes-trusted.json
          RISK_TIER: ${{ needs.risk-classify.outputs.risk }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_SHA: ${{ inputs.pipeline_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DIFF_TEXT_PATH: /tmp/pr.diff
          CHANGED_FILES_FILE: /tmp/changed_files.txt
          EXPECTED_MANIFEST_DIGEST: ${{ needs.ai-manifest.outputs.digest }}
          RESULTS_DIRECTORY: /tmp/apes-results
        run: node pipeline/scripts/ai-chunk-protocol.js aggregate

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [ref-guard, risk-classify, deterministic-checks, security-scan, provider-preflight, ai-review]
    if: always()
    steps:
      - name: Fail closed on invalid APES pipeline ref
        if: ${{ needs.ref-guard.result != 'success' }}
        run: |
          echo "APES pipeline ref validation failed; refusing to evaluate the gate with untrusted/mutable pipeline code." >&2
          exit 1
      - name: Checkout pinned APES pipeline
        if: ${{ needs.ref-guard.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jayblisstech-bot/ai-production-engineering-standard
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.ref-guard.result == 'success' }}
        with:
          node-version: "20"
      - name: Enforce machine controls and severity thresholds (fail closed)
        if: ${{ needs.ref-guard.result == 'success' }}
        env:
          RISK_RESULT: ${{ needs.risk-classify.result }}
          VALIDATION_RESULT: ${{ needs.deterministic-checks.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          AI_RESULT: ${{ needs.ai-review.result }}
          MODEL_TIER: ${{ needs.risk-classify.outputs.model_tier }}
          VERDICT: ${{ needs.ai-review.outputs.verdict }}
          P0_COUNT: ${{ needs.ai-review.outputs.p0_count }}
          P1_COUNT: ${{ needs.ai-review.outputs.p1_count }}
          RESTRICTED_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
        run: node pipeline/scripts/enforce-gate.js
